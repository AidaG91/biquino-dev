<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/FAVICON.svg" />
    <meta
      name="description"
      content="Biquiño Studio — Impresión digital en España. Vinilos, lonas, rótulos, soportes publicitarios y papelería corporativa para tu negocio."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Biquiño</title>
  </head>
  <body>
    <div id="root"></div>
    
    <!-- Formulario fantasma para que Netlify lo detecte -->
    <form
      name="contact"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="phone" />
      <textarea name="message"></textarea>
    </form>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
