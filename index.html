<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/public/FAVICON.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Biquiño</title>
  </head>
  <body>
    <div id="root"></div>

    <noscript>
      <div style="font-family:system-ui,sans-serif;max-width:480px;margin:4rem auto;padding:0 1.5rem;text-align:center;color:#1c1410">
        <h1 style="font-size:1.5rem;margin-bottom:1rem">Biquiño — Impresión digital en España</h1>
        <p style="line-height:1.6;color:#4a3b38">
          Esta web necesita JavaScript habilitado para funcionar.
          Si lo necesitas, puedes contactarnos directamente:
        </p>
        <p style="margin-top:1.5rem">
          <a href="mailto:biquinostudio@gmail.com" style="color:#e62556;font-weight:700">biquinostudio@gmail.com</a>
        </p>
        <p>
          <a href="tel:+34630536821" style="color:#e62556;font-weight:700">+34 630 53 68 21</a>
        </p>
      </div>
    </noscript>
    
    <!-- Formulario fantasma para que Netlify lo detecte -->
    <form
      name="contact"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="phone" />
      <select name="servicio"></select>
      <textarea name="message"></textarea>
    </form>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
